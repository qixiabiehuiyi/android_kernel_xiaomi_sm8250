name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'pipa'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
          - both
      droidspaces:
        description: 'Enable Droidspaces (容器支持)'
        required: true
        type: boolean
        default: true
      kernel_name:
        description: 'Kernel name suffix (内核显示名后缀)'
        required: true
        type: string
        default: 'pipa-ds'

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }} | DS:${{ github.event.inputs.droidspaces }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3 coccinelle

    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz

    - name: Patch Droidspaces
      if: ${{ github.event.inputs.droidspaces == 'true' }}
      run: |
        set -e
        mkdir -p Patches/Droidspaces

        cat > Patches/Droidspaces/droidspaces.config <<'DS_CONFIG_EOF'
        # Kernel configurations for full DroidSpaces support
        # Copyright (C) 2026 ravindu644 <droidcasts@protonmail.com>

        # IPC mechanisms
        CONFIG_SYSCTL=y
        CONFIG_SYSVIPC=y
        CONFIG_POSIX_MQUEUE=y

        # Core namespace support
        CONFIG_NAMESPACES=y
        CONFIG_PID_NS=y
        CONFIG_UTS_NS=y
        CONFIG_IPC_NS=y

        # Seccomp support
        CONFIG_SECCOMP=y
        CONFIG_SECCOMP_FILTER=y

        # Control groups support
        CONFIG_CGROUPS=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_FAIR_GROUP_SCHED=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_NET_PRIO=y

        # Resource limits: --memory, --cpus, --pids-limit, in that order, then the
        # accounting that reports CPU usage on kernels before 4.15.
        # Optional: a limit whose option is missing is skipped with a warning
        CONFIG_MEMCG=y
        CONFIG_CFS_BANDWIDTH=y
        CONFIG_CGROUP_PIDS=y
        CONFIG_CGROUP_CPUACCT=y

        # Device filesystem support
        CONFIG_DEVTMPFS=y

        # Overlay filesystem support (required for volatile mode)
        CONFIG_OVERLAY_FS=y

        # Enable xattr, posix acl support on tmpfs
        # For NixOS support
        CONFIG_TMPFS_POSIX_ACL=y
        CONFIG_TMPFS_XATTR=y

        # Firmware loading support
        CONFIG_FW_LOADER=y
        CONFIG_FW_LOADER_USER_HELPER=y
        CONFIG_FW_LOADER_COMPRESS=y

        # Droidspaces Network Isolation Support - NAT/none modes
        CONFIG_NET_NS=y
        CONFIG_VETH=y
        CONFIG_BRIDGE=y
        CONFIG_NETFILTER=y
        CONFIG_BRIDGE_NETFILTER=y
        CONFIG_NETFILTER_ADVANCED=y
        CONFIG_NF_CONNTRACK=y
        CONFIG_IP_NF_IPTABLES=y
        CONFIG_IP_NF_FILTER=y
        CONFIG_NF_NAT=y
        CONFIG_NF_TABLES=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
        CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NF_CONNTRACK_NETLINK=y
        CONFIG_NF_NAT_REDIRECT=y
        CONFIG_IP_ADVANCED_ROUTER=y
        CONFIG_IP_MULTIPLE_TABLES=y

        # legacy compat
        CONFIG_NF_CONNTRACK_IPV4=y
        CONFIG_NF_NAT_IPV4=y
        CONFIG_IP_NF_NAT=y

        # IPv6 in NAT mode (NAT66). Optional: without these, NAT containers are IPv4 only
        CONFIG_IPV6=y
        CONFIG_IPV6_MULTIPLE_TABLES=y
        CONFIG_IP6_NF_IPTABLES=y
        CONFIG_IP6_NF_FILTER=y
        CONFIG_IP6_NF_MANGLE=y
        CONFIG_IP6_NF_NAT=y
        CONFIG_IP6_NF_TARGET_MASQUERADE=y

        # legacy compat
        CONFIG_NF_CONNTRACK_IPV6=y
        CONFIG_NF_NAT_IPV6=y

        # Macvlan mode (--net=macvlan): a container straight on a wired LAN.
        # Optional: without it, macvlan mode is unavailable
        CONFIG_MACVLAN=y

        # Disable this on older kernels to make internet work
        CONFIG_ANDROID_PARANOID_NETWORK=n

        # Fix for docker unsafe procfs error
        CONFIG_USER_NS=y

        # UFW & FAIL2BAN CORE
        CONFIG_NETFILTER_XT_MATCH_COMMENT=y
        CONFIG_NETFILTER_XT_MATCH_STATE=y
        CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
        CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
        CONFIG_NETFILTER_XT_MATCH_HL=y
        CONFIG_NETFILTER_XT_TARGET_REJECT=y
        CONFIG_IP_NF_TARGET_REJECT=y
        CONFIG_NETFILTER_XT_TARGET_LOG=y
        CONFIG_IP_NF_TARGET_ULOG=y
        CONFIG_NETFILTER_XT_MATCH_RECENT=y
        CONFIG_NETFILTER_XT_MATCH_LIMIT=y
        CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y
        CONFIG_NETFILTER_XT_MATCH_OWNER=y
        CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y
        CONFIG_NETFILTER_XT_MATCH_MARK=y
        CONFIG_NETFILTER_XT_TARGET_MARK=y
        CONFIG_IP_SET=y
        CONFIG_IP_SET_HASH_IP=y
        CONFIG_IP_SET_HASH_NET=y
        CONFIG_NETFILTER_XT_SET=y
        CONFIG_NETFILTER_NETLINK_QUEUE=y
        CONFIG_NETFILTER_NETLINK_LOG=y
        CONFIG_NETFILTER_XT_TARGET_NFLOG=y
DS_CONFIG_EOF

        cat > Patches/Droidspaces/fix_kernel_panic_in_xt_qtaguid.cocci <<'COCCI1_EOF'
        @remove_dev_stats@
        @@
        static int iface_stat_fmt_proc_show(struct seq_file *m, void *v)
        {
            ...
        -	struct rtnl_link_stats64 dev_stats;
            ...
        }

        @@
        @@
        static int iface_stat_fmt_proc_show(struct seq_file *m, void *v)
        {
            ...
        -	if (iface_entry->active) {
        -		stats = dev_get_stats(iface_entry->net_dev,
        -				      &dev_stats);
        -	} else {
        -		stats = &no_dev_stats;
        -	}
        +	stats = &no_dev_stats;
            ...
        }
COCCI1_EOF

        cat > Patches/Droidspaces/fix_restore_cgroup_file_prefix_handling.cocci <<'COCCI2_EOF'
        @@
        @@

        static int cgroup_add_file(...){
        ...
            if (cft->file_offset) {
                ...
        		spin_unlock_irq(&cgroup_file_kn_lock);
            }

        +	if (cft->ss && (cgrp->root->flags & CGRP_ROOT_NOPREFIX) && !(cft->flags & CFTYPE_NO_PREFIX)) {
        +		snprintf(name, CGROUP_FILE_NAME_MAX, "%s.%s", cft->ss->name, cft->name);
        +		kernfs_create_link(cgrp->kn, name, kn);
        +	}
            return 0;
        }
COCCI2_EOF

        DEFCONFIG="arch/arm64/configs/${{ github.event.inputs.device }}_defconfig"
        echo "[*] Appending droidspaces config to $DEFCONFIG"
        cat Patches/Droidspaces/droidspaces.config >> "$DEFCONFIG"

        if [ -f net/netfilter/xt_qtaguid.c ]; then
          echo "[*] Patching xt_qtaguid.c"
          spatch --sp-file Patches/Droidspaces/fix_kernel_panic_in_xt_qtaguid.cocci --in-place net/netfilter/xt_qtaguid.c \
            || echo "[!] xt_qtaguid patch failed (ignored)"
        else
          echo "[-] xt_qtaguid.c not found, skipped"
        fi

        if [ -f kernel/cgroup/cgroup.c ] && ! grep -q kernfs_create_link kernel/cgroup/cgroup.c; then
          echo "[*] Patching kernel/cgroup/cgroup.c"
          spatch --sp-file Patches/Droidspaces/fix_restore_cgroup_file_prefix_handling.cocci --in-place kernel/cgroup/cgroup.c \
            || echo "[!] cgroup patch failed (ignored)"
        elif [ -f kernel/cgroup.c ] && ! grep -q kernfs_create_link kernel/cgroup.c; then
          echo "[*] Patching kernel/cgroup.c"
          spatch --sp-file Patches/Droidspaces/fix_restore_cgroup_file_prefix_handling.cocci --in-place kernel/cgroup.c \
            || echo "[!] cgroup patch failed (ignored)"
        else
          echo "[-] cgroup already patched or not found, skipped"
        fi
        echo "[+] Droidspaces patch done"

    - name: Pin KernelSU Version
      if: ${{ github.event.inputs.ksu == 'true' }}
      run: |
        set -e
        echo "[*] Original KernelSU setup line:"
        grep -n 'setup.sh' build_kernel.sh || true
        # 钉住 KernelSU 版本：上游 main 的 susfs_compat.mk 会因为内核 SuSFS 补丁较旧而
        # 直接 $(error Please wait susfs update.)，必须用与内核配套的旧版本
        sed -i 's#kernel/setup\.sh" | bash#kernel/setup.sh" | bash -s v4.2.0-rc1#' build_kernel.sh
        echo "[*] Patched KernelSU setup line:"
        grep -n 'setup.sh' build_kernel.sh

    - name: Set Kernel Name
      run: |
        set -e
        DEFCONFIG="arch/arm64/configs/${{ github.event.inputs.device }}_defconfig"
        NAME="${{ github.event.inputs.kernel_name }}"
        if [ -n "$NAME" ]; then
          echo "[*] Setting CONFIG_LOCALVERSION to -$NAME"
          sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"-$NAME\"|" "$DEFCONFIG"
        fi
        echo "[*] Current LOCALVERSION lines:"
        grep -n '^CONFIG_LOCALVERSION' "$DEFCONFIG" || true

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh

        ARGS="${{ github.event.inputs.device }}"

        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi

        if [ "${{ github.event.inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ github.event.inputs.target_os }}"
        fi

        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: APTKernel-${{ github.event.inputs.device }}-${{ github.event.inputs.target_os }}-DS${{ github.event.inputs.droidspaces }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0
